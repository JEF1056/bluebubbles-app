<!DOCTYPE html>

  <!-- PWA & iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BlueBubbles">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=5">

  <!-- Google auth details -->
  <meta name="google-signin-client_id" content="500464701389-8trcdkcj7ni5l4dn6n7l795rhb1asnh3.apps.googleusercontent.com">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico?v=5">

  <title>BlueBubbles</title>
  <link rel="manifest" href="manifest.json?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400..700;1,400..700&display=swap">

  <!-- MapLibre GL JS (preloaded & pinned to 6.19.0 for maplibre_web ^0.4.0) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.19.0/dist/maplibre-gl.css" integrity="sha384-S+OnE5M4U3Qc2nR0RgljGrVs06xqfRg8L7uFk/pOF5+sRuSDG4oKkqKZmFrx7w09" crossorigin="anonymous">
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.19.0/dist/maplibre-gl.mjs" integrity="sha384-xwIwS2ZrVZdy1v8I+MtCDAkB+tCwelpTdNz9yPRN03mYLaG5HTwyhOnylbOgukuC" crossorigin="anonymous">
  <script>
    window.flutterMapLibre = { maplibreGlVersion: "6.19.0" };
    // The app has no pmtiles:// sources; stub window.pmtiles so maplibre_web skips unpinned jsDelivr fetch.
    window.pmtiles = { Protocol: class { tile() {} } };
  </script>

  <style id="splash-screen-style">
    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
      background-size: 100% 100%;
      font-family: "Google Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #000000;
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
    window.addEventListener("flutter-first-frame", removeSplashFromWeb, { once: true });
  </script>
</head>
<body>
  <picture id="splash">
    <source srcset="splash/img/light-1x.png?v=5 1x, splash/img/light-2x.png?v=5 2x, splash/img/light-3x.png?v=5 3x, splash/img/light-4x.png?v=5 4x" media="(prefers-color-scheme: light)">
    <source srcset="splash/img/dark-1x.png?v=5 1x, splash/img/dark-2x.png?v=5 2x, splash/img/dark-3x.png?v=5 3x, splash/img/dark-4x.png?v=5 4x" media="(prefers-color-scheme: dark)">
    <img class="center" aria-hidden="true" src="splash/img/light-1x.png?v=5" alt="">
  </picture>

  <script>
    (function () {
      const rev = "bb-20261119-v7";
      const boot = () => {
        const s = document.createElement("script");
        s.src = "flutter_bootstrap.js?v=" + rev;
        s.async = true;
        document.body.appendChild(s);
      };
      try {
        if (localStorage.getItem("bb_web_cache_rev") === rev) return boot();
        const tasks = [];
        if ("serviceWorker" in navigator) {
          tasks.push(navigator.serviceWorker.getRegistrations().then((rs) => Promise.all(rs.map((r) => r.unregister()))));
        }
        if ("caches" in window) {
          tasks.push(caches.keys().then((ks) => Promise.all(ks.map((k) => caches.delete(k)))));
        }
        Promise.allSettled(tasks).finally(() => {
          try { localStorage.setItem("bb_web_cache_rev", rev); } catch (_) {}
          if (navigator.serviceWorker && navigator.serviceWorker.controller && !sessionStorage.getItem(rev)) {
            try { sessionStorage.setItem(rev, "1"); } catch (_) {}
            location.reload();
            return;
          }
          boot();
        });
      } catch (_) {
        boot();
      }
    })();
  </script>
</body>
</html>
